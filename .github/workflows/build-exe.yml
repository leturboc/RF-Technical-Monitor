name: Build TinySA-Monitor.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Tests (logique + GUI simulée)
        shell: bash
        run: |
          bad=0
          for t in test_v7 test_im test_plan smoke_test smoke_test2 smoke_test3 smoke_test4 smoke_test5 test_alertes; do
            echo "== $t"
            if ! python -u tests/$t.py > "out_$t.log" 2>&1; then
              bad=1
              # échecs visibles dans les annotations du run (journaux complets dans l'onglet Actions)
              grep -E "^FAIL|Error|Traceback" "out_$t.log" | head -8 | while IFS= read -r l; do
                echo "::error title=$t::$l"
              done
              tail -5 "out_$t.log" | tr '\n' '|' | sed "s/^/::error title=$t (fin)::/"; echo
            fi
            tail -3 "out_$t.log"
          done
          exit $bad

      - name: Interface réelle (vrai Qt Windows)
        continue-on-error: true
        shell: bash
        timeout-minutes: 8
        run: |
          set +e
          python -u tests/gui_reel.py tests/captures > gui_reel.log 2>&1
          rc=$?
          cat gui_reel.log
          # résumé visible dans les annotations du run (OK / FAIL / exceptions)
          grep -E "^(OK|FAIL)|ÉCHECS|Error|error|Traceback" gui_reel.log | head -40 | while IFS= read -r l; do
            echo "::notice title=gui_reel::$l"
          done
          tail -15 gui_reel.log | tr '\n' '|' | sed 's/^/::warning title=gui_reel (fin)::/'; echo
          exit $rc

      - name: Captures de l'interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface-windows
          path: tests/captures/
          if-no-files-found: ignore

      - name: Compilation
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name TinySA-Monitor tinysa_monitor.py

      - name: Exe (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: TinySA-Monitor
          path: dist/TinySA-Monitor.exe

      - name: Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TinySA-Monitor.exe
          # v7.1-beta1 (avec tiret) = pré-release de test ; v7.1 = version stable (« latest »)
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Télécharger :** `TinySA-Monitor.exe` ci-dessous (Windows, aucune installation).
            Au premier lancement, SmartScreen peut avertir (exe non signé) : « Informations complémentaires » › « Exécuter quand même ».
            PC du 2ᵉ tinySA en réseau : lancer `TinySA-Monitor.exe --relais`.

      - name: Pré-release de test (push sur une branche autre que main)
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag -y || true
          gh release create "$tag" dist/TinySA-Monitor.exe --prerelease --target "$GITHUB_SHA" \
            --title "Test ${GITHUB_REF_NAME} — $(date -u +'%d/%m %H:%M') UTC" \
            --notes "Version de test (branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}), remplacée à chaque push.
          Télécharger TinySA-Monitor.exe ci-dessous. SmartScreen (exe non signé) : « Informations complémentaires » › « Exécuter quand même ».
          PC du 2ᵉ tinySA en réseau : lancer TinySA-Monitor.exe --relais."

      - name: Release stable (push sur main, une fois par version)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 -oP '^APP_VER = "\K[^"]+' tinysa_monitor.py)
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "Release v$ver déjà publiée : rien à faire (monte APP_VER pour une nouvelle version)."
          else
            gh release create "v$ver" dist/TinySA-Monitor.exe --target "$GITHUB_SHA" --title "TinySA Monitor $ver" \
              --generate-notes --latest
          fi

