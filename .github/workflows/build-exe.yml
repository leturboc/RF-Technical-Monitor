name: Build TinySA-Monitor.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # notes de travail seulement : pas de compilation (économie de minutes)
    paths-ignore: ["CLAUDE.md", "README.md", "apercu/**", ".github/workflows/menage-releases.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Économie de minutes (quota GitHub épuisé le 10/11/2026 : une minute Windows compte double) :
# - un nouveau push sur la même branche annule la compilation en cours (jamais sur main : c'est la release) ;
# - sur main, le commit a déjà été testé sur ui-validation : tests et captures d'interface sautés, seulement
#   compilation + auto-test de l'exe + release, et RIEN si la release de cette version existe déjà ;
# - la V8 n'est plus recompilée à chaque synchro (sync-v8.yml) : à la demande (Actions › Run workflow › v8-sdr).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # petit job Linux (≈ 10 s) : sur main, faut-il compiler ? (non si la release de APP_VER existe déjà)
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ver=$(grep -m1 -oP '^APP_VER = "\K[^"]+' tinysa_monitor.py)
            if gh release view "v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              go=false; echo "::notice::Release v$ver déjà publiée : pas de compilation (monte APP_VER pour publier)."
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Tests (logique + GUI simulée)
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          bad=0
          for t in test_v7 test_im test_plan smoke_test smoke_test2 smoke_test3 smoke_test4 smoke_test5 smoke_test6 test_alertes test_i18n test_relais_pi test_garde test_sdr test_sdr_qt; do
            [ -f "tests/$t.py" ] || continue      # même liste en V7 et en V8 (tests SDR : V8 seulement)
            echo "== $t"
            if ! python -u tests/$t.py > "out_$t.log" 2>&1; then
              bad=1
              # échecs visibles dans les annotations du run (journaux complets dans l'onglet Actions)
              grep -E "^FAIL|Error|Traceback" "out_$t.log" | head -8 | while IFS= read -r l; do
                echo "::error title=$t::$l"
              done
              tail -5 "out_$t.log" | tr '\n' '|' | sed "s/^/::error title=$t (fin)::/"; echo
            fi
            tail -3 "out_$t.log"
          done
          exit $bad

      - name: Interface réelle (vrai Qt Windows)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        shell: bash
        timeout-minutes: 8
        run: |
          set +e
          python -u tests/gui_reel.py tests/captures > gui_reel.log 2>&1
          rc=$?
          cat gui_reel.log
          # résumé visible dans les annotations du run (OK / FAIL / exceptions)
          # seulement les échecs (GitHub ne montre que 10 annotations par étape)
          grep -E "^FAIL|Traceback|Error:|ÉCHECS: [1-9]" gui_reel.log | head -9 | while IFS= read -r l; do
            echo "::error title=gui_reel::$l"
          done
          grep -q "ÉCHECS: 0" gui_reel.log && echo "::notice title=gui_reel::interface Windows : ÉCHECS 0"
          exit $rc

      - name: Interface en anglais (vrai Qt Windows)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        shell: bash
        timeout-minutes: 6
        run: |
          set +e
          python -u tests/gui_en.py tests/captures/en > gui_en.log 2>&1
          rc=$?
          tail -40 gui_en.log
          grep -E "^FR |Traceback|Error:" gui_en.log | head -9 | while IFS= read -r l; do
            echo "::error title=gui_en::$l"
          done
          grep -q "ÉCHECS: 0" gui_en.log && echo "::notice title=gui_en::interface anglaise : ÉCHECS 0"
          exit $rc

      - name: Captures de l'interface
        if: always() && github.ref != 'refs/heads/main'
        continue-on-error: true            # quota d'artefacts plein : ne doit jamais bloquer l'exe ni la release
        uses: actions/upload-artifact@v4
        with:
          name: captures-interface-windows
          path: tests/captures/
          if-no-files-found: ignore
          retention-days: 3

      - name: Compilation
        shell: bash
        run: |
          # traductions françaises de Qt (boutons Oui / Non, Annuler…) embarquées explicitement
          tr=$(python -c "from PySide6.QtCore import QLibraryInfo as Q; print(Q.path(Q.LibraryPath.TranslationsPath))")
          extra=""; [ -f lang_en_v8.py ] && extra="--hidden-import lang_en_v8"     # V8 : ses traductions
          python -m PyInstaller --noconfirm --onefile --noconsole --name TinySA-Monitor \
            --icon assets/icone.ico --add-data "assets/icone.png;." --add-data "docs/manuel.html;docs" --add-data "docs/manual_en.html;docs" \
            --add-data "$tr/qtbase_fr.qm;PySide6/Qt/translations" --hidden-import lang_en --hidden-import PySide6.QtMultimedia \
            --hidden-import serial.urlhandler.protocol_socket --hidden-import serial.urlhandler.protocol_rfc2217 $extra tinysa_monitor.py

      - name: Auto-test de l'exe (réseau, traductions, son, manuels)
        shell: bash
        run: |
          # ce qui est chargé à la demande peut manquer dans l'exe sans qu'aucun test Python ne le voie (7.23.1 :
          # pas de socket:// → tinySA en réseau impossible) ; l'exe sans console écrit son résultat dans un fichier
          timeout 180 ./dist/TinySA-Monitor.exe --selftest selftest.txt || true
          cat selftest.txt || echo "pas de selftest.txt"
          n=$(grep -oP 'ÉCHECS: \K\d+' selftest.txt || echo 99)
          if [ "$n" = "0" ]; then echo "::notice title=auto-test exe::ÉCHECS 0"; else
            echo "::error title=auto-test exe::ÉCHECS $n — $(grep FAIL selftest.txt | tr '\n' ' ')"; exit 1; fi

      - name: Kit Raspberry Pi (relais-raspberry-pi.zip)
        shell: bash
        run: |
          # dossier relais/ (fins de ligne Unix forcées : le checkout Windows peut les passer en CRLF, mortel pour sh)
          python - <<'EOF'
          import pathlib, zipfile
          with zipfile.ZipFile("dist/relais-raspberry-pi.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(pathlib.Path("relais").iterdir()):
                  if f.is_file() and f.suffix in (".py", ".sh", ".md"):
                      zi = zipfile.ZipInfo(f"relais/{f.name}", (2026, 1, 1, 0, 0, 0))
                      zi.external_attr = (0o755 if f.suffix == ".sh" else 0o644) << 16
                      z.writestr(zi,
                                 f.read_bytes().replace(b"\r\n", b"\n"))
          print("dist/relais-raspberry-pi.zip OK")
          EOF

      - name: Exe (artefact)
        continue-on-error: true            # l'exe est aussi dans la (pré-)release
        uses: actions/upload-artifact@v4
        with:
          name: TinySA-Monitor
          path: dist/TinySA-Monitor.exe
          retention-days: 3

      - name: Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TinySA-Monitor.exe
            dist/relais-raspberry-pi.zip
          # v7.1-beta1 (avec tiret) = pré-release de test ; v7.1 = version stable (« latest »)
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            **Télécharger :** `TinySA-Monitor.exe` ci-dessous (Windows, aucune installation).
            Au premier lancement, SmartScreen peut avertir (exe non signé) : « Informations complémentaires » › « Exécuter quand même ».
            PC du 2ᵉ tinySA en réseau : lancer `TinySA-Monitor.exe --relais`.

      - name: Pré-release de test (push sur une branche autre que main)
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag -y || true
          gh release create "$tag" dist/TinySA-Monitor.exe dist/relais-raspberry-pi.zip --prerelease --target "$GITHUB_SHA" \
            --title "Test ${GITHUB_REF_NAME} — $(date -u +'%d/%m %H:%M') UTC" \
            --notes "Version de test (branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}), remplacée à chaque push.
          Télécharger TinySA-Monitor.exe ci-dessous. SmartScreen (exe non signé) : « Informations complémentaires » › « Exécuter quand même ».
          PC du 2ᵉ tinySA en réseau : lancer TinySA-Monitor.exe --relais. Raspberry Pi : relais-raspberry-pi.zip (voir LISEZMOI.md)."

      - name: Release stable (push sur main, une fois par version)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 -oP '^APP_VER = "\K[^"]+' tinysa_monitor.py)
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "Release v$ver déjà publiée : rien à faire (monte APP_VER pour une nouvelle version)."
          else
            gh release create "v$ver" dist/TinySA-Monitor.exe dist/relais-raspberry-pi.zip --target "$GITHUB_SHA" --title "TinySA Monitor $ver" \
              --generate-notes --latest
          fi


  # Tests qui ont besoin d'un port série virtuel (pty) : impossibles sous Windows (revue de code 7.41).
  linux-tests:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 > /dev/null
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Réseau, relais, garde (faux tinySA)
        shell: bash
        run: |
          bad=0
          for t in test_reseau test_reseau_qt test_relais_pi test_garde test_v7; do
            echo "== $t"
            if ! timeout 900 python -u tests/$t.py > "out_$t.log" 2>&1; then
              bad=1
              grep -E "^FAIL|Error|Traceback" "out_$t.log" | head -8 | while IFS= read -r l; do echo "::error title=$t (Linux)::$l"; done
            fi
            tail -1 "out_$t.log"
          done
          exit $bad
