name: Synchroniser la V8 avec la V7

# Chaque mise à jour de la V7 (branche ui-validation) est fusionnée tout de suite dans la V8 (branche v8-sdr),
# pour que les deux versions ne divergent pas. En cas de conflit : rien n'est poussé, le run échoue avec la
# liste des fichiers en conflit (à fusionner à la main).

on:
  push:
    branches: ["ui-validation"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-v8
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8-sdr
          fetch-depth: 0
      - name: Fusionner ui-validation dans v8-sdr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin ui-validation
          if git merge-base --is-ancestor origin/ui-validation HEAD; then
            echo "::notice::La V8 contient déjà toute la V7 : rien à faire."
            exit 0
          fi
          if git merge --no-edit -m "Fusion automatique de la V7 (ui-validation) dans la V8" origin/ui-validation; then
            git push origin v8-sdr
            # 11/2026 : plus de recompilation automatique de la V8 à chaque synchro (≈ 40 % du quota de minutes).
            # Pour une nouvelle pré-release test-v8-sdr : Actions › Build TinySA-Monitor.exe › Run workflow › v8-sdr.
            echo "::notice::V8 à jour avec la V7 ($(git rev-parse --short origin/ui-validation)). Pré-release test-v8-sdr : à lancer à la main si besoin."
          else
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort
            echo "::error::Conflit V7 → V8 dans : ${files}— rien n'a été poussé ; fusion à faire à la main (demande à Claude)."
            exit 1
          fi
